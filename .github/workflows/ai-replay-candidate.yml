# Optional KI/Replay candidate: no GitHub Release or main merge.
name: AI/Replay Windows candidate

on:
  pull_request:
    paths:
      - "include/GymAi.h"
      - "include/GymReplay.h"
      - "src/GymAi.cpp"
      - "src/GymReplay.cpp"
      - "src/ai_main.cpp"
      - "src/AiConsoleUI.cpp"
      - "include/AiConsoleUI.h"
      - "tests/ai_console_ui_tests.cpp"
      - "tests/ai_console_flow_test.py"
      - "tests/ai_replay_tests.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/ai-replay-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ai-candidate:
    name: Windows / AI executable and SHA256 candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure (AI on, GUI off)
        shell: pwsh
        run: cmake -S . -B build-ai -DGYM_BUILD_AI=ON -DGYM_BUILD_GUI=OFF
      - name: Compile standalone AI mode
        shell: pwsh
        run: cmake --build build-ai --config Release --parallel
      - name: Run all C++ and integration tests
        shell: pwsh
        run: ctest --test-dir build-ai -C Release --output-on-failure
      - name: Smoke-test actual interactive AI process
        shell: pwsh
        run: |
          $exe = 'build-ai/Release/vier-gewinnt-ki.exe'
          if (-not (Test-Path $exe)) { throw "AI executable missing: $exe" }
          $output = @('00') | & $exe 2>&1
          if ($LASTEXITCODE -ne 0) { throw "AI CLI smoke test returned $LASTEXITCODE" }
          if (-not (($output -join [Environment]::NewLine) -match "KI-ARENA")) {
            throw 'AI Arena did not print its expected title'
          }
      - name: Package ZIP with integrity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'dist/ki-candidate'
          $zipPath = 'dist/vier-gewinnt-ki-windows-candidate.zip'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath 'build-ai/Release/vier-gewinnt-ki.exe' -Destination "$stage/vier-gewinnt-ki.exe"
          Copy-Item -LiteralPath 'docs/AI_REPLAY.md' -Destination "$stage/ANLEITUNG.md"
          $sha = (Get-FileHash "$stage/vier-gewinnt-ki.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$stage/SHA256SUMS.txt" -Value "$sha  vier-gewinnt-ki.exe" -Encoding ascii
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('vier-gewinnt-ki.exe', 'ANLEITUNG.md', 'SHA256SUMS.txt')) {
              if ($required -notin $names) { throw "ZIP entry missing: $required" }
            }
            if ($names.Count -ne 3) { throw "Unexpected ZIP entries: $($names -join ', ')" }
          } finally {
            $zip.Dispose()
          }
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" -Value "$zipHash  vier-gewinnt-ki-windows-candidate.zip" -Encoding ascii
          Write-Host "AI release-candidate ZIP verified: $zipHash"
      - name: Upload Windows candidate (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: vier-gewinnt-ki-windows-candidate
          path: |
            dist/vier-gewinnt-ki-windows-candidate.zip
            dist/vier-gewinnt-ki-windows-candidate.zip.sha256
          if-no-files-found: error
