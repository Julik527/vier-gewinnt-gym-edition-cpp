# JK AXIS | GOLD MASTER
# Projekt: Vier Gewinnt | Gym Edition
# Datei:   .github/workflows/docs-quality.yml
# Aufgabe: Prueft die veroeffentlichten Dokumente ohne sie zu ueberschreiben.
# ------------------------------------------------------------

name: Document & Brand QA

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "reference/**"
      - "praesentation/**"
      - "assets/brand/**"
      - "docs/**"
      - "scripts/document_preflight.py"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "reference/**"
      - "praesentation/**"
      - "assets/brand/**"
      - "docs/**"
      - "scripts/document_preflight.py"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

# Der Check veraendert keine Dateien im Repository.
jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install format validators
        run: python -m pip install python-pptx PyMuPDF
      # So merken wir, wenn eine Folie, PDF-Seite oder ein Dateilink kaputt ist.
      - name: Technical preflight for all published documents
        run: python scripts/document_preflight.py
