# JK AXIS | GOLD MASTER
# Projekt: Vier Gewinnt | Gym Edition
# Datei:   .github/workflows/cpp-quality.yml
# Aufgabe: Prüft den C++-Code bei Änderungen auf Linux und Windows.
# ------------------------------------------------------------

name: C++ Gold Standard QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".github/workflows/cpp-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".github/workflows/cpp-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

# Beide Betriebssysteme und beide Build-Arten werden getrennt geprüft.
jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      # Erst kompilieren, dann alle registrierten Tests ausführen.
      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  gui-build:
    name: SFML 3.1 GUI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install X11/OpenGL build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libgl1-mesa-dev libx11-dev libxext-dev libharfbuzz-dev libflac-dev libogg-dev libvorbis-dev libopenal-dev xvfb xauth
      - name: Configure SFML 3.1 graphics target
        shell: bash
        run: cmake -S . -B build-gui -DGYM_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile graphical game and shared match tests
        shell: bash
        run: cmake --build build-gui --config Release --target vier-gewinnt-gui match_session_tests --parallel 2
      - name: Verify original school logo is packaged
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "71bc2f41e221b85e09907cedaeecb861b025b047"
          copies = list(Path("build-gui").rglob("assets/school/bernd-blindow-schulen.jpg"))
          if not copies:
              raise SystemExit("FEHLER: Original-Schullogo fehlt neben GUI-EXE.")
          for logo in copies:
              digest = hashlib.sha1(logo.read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f"Ungueltige Schul-Logo-Datei: {logo}: {digest}")
              print(f"Schullogo OK: {logo}")
          PY
      - name: Test headless GUI core without a desktop
        shell: bash
        run: ctest --test-dir build-gui -C Release --output-on-failure -R 'match_session_unit_tests|gui_core_smoke|gui_window_smoke'
      - name: Upload Windows 2D game executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gym-edition-2d-windows-msvc
          path: |
            build-gui/**/vier-gewinnt-gui.exe
            build-gui/**/sfml-*.dll
            build-gui/**/assets/school/bernd-blindow-schulen.jpg
          if-no-files-found: error
