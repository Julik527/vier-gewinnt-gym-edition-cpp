# JK AXIS | GOLD MASTER
# Projekt: Vier Gewinnt | Gym Edition
# Datei:   .github/workflows/cpp-quality.yml
# Aufgabe: Prüft den C++-Code bei Änderungen auf Linux und Windows.
# ------------------------------------------------------------

name: C++ Gold Standard QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".github/workflows/cpp-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".github/workflows/cpp-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

# Beide Betriebssysteme und beide Build-Arten werden getrennt geprüft.
jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      # Erst kompilieren, dann alle registrierten Tests ausführen.
      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
 
  # Zusaetzlicher Lauf mit Laufzeitpruefung auf undefiniertes C++-Verhalten.
  undefined-behavior:
    name: ubuntu-latest / UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (UBSan)
        shell: bash
        run: >-
          cmake -S . -B build-ubsan
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined"
      - name: Build (UBSan)
        shell: bash
        run: cmake --build build-ubsan --parallel
      - name: Run tests (UBSan)
        shell: bash
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ctest --test-dir build-ubsan --output-on-failure

  # Prueft exakt die Compiler-Familie und das UCRT64-Terminal des Schul-Setups.
  msys2-ucrt64:
    name: windows-latest / MSYS2 UCRT64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Configure (UCRT64)
        shell: msys2 {0}
        run: cmake -S . -B build-ucrt -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build (UCRT64)
        shell: msys2 {0}
        run: cmake --build build-ucrt --parallel
      - name: Run tests (UCRT64)
        shell: msys2 {0}
        run: ctest --test-dir build-ucrt --output-on-failure
      - name: Verify the VS Code compiler command
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -g -O0 -Wall -Wextra -Wpedantic -Iinclude \
            src/main.cpp src/Board.cpp src/Game.cpp src/ConsoleUI.cpp \
            -o vier-gewinnt.exe
          python tests/integration_smoke.py ./vier-gewinnt.exe
          python tests/integration_adversarial.py ./vier-gewinnt.exe

