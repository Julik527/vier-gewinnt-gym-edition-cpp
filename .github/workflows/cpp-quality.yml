# JK AXIS | GOLD MASTER
# Projekt: Vier Gewinnt | Gym Edition
# Datei:   .github/workflows/cpp-quality.yml
# Aufgabe: Prüft den C++-Code bei Änderungen auf Linux und Windows.
# ------------------------------------------------------------

name: C++ Gold Standard QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".github/workflows/cpp-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".vscode/launch.json"
      - ".vscode/tasks.json"
      - ".github/workflows/cpp-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

# Beide Betriebssysteme und beide Build-Arten werden getrennt geprüft.
jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      # Erst kompilieren, dann alle registrierten Tests ausführen.
      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  ucrt64-console:
    name: MSYS2 UCRT64 / ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Configure with the same GCC toolchain as the classroom
        shell: msys2 {0}
        run: cmake -S . -B build-ucrt64 -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DGYM_BUILD_GUI=OFF
      - name: Compile
        shell: msys2 {0}
        run: cmake --build build-ucrt64 --parallel 2
      - name: Test the rules, persistence and console
        shell: msys2 {0}
        run: ctest --test-dir build-ucrt64 --output-on-failure

  gui-build:
    name: SFML 3.1 GUI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install X11/OpenGL build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libgl1-mesa-dev libx11-dev libxext-dev libharfbuzz-dev libflac-dev libogg-dev libvorbis-dev libopenal-dev xvfb xauth
      - name: Configure SFML 3.1 graphics target
        shell: bash
        run: cmake -S . -B build-gui -DGYM_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile graphical game and shared match tests
        shell: bash
        run: cmake --build build-gui --config Release --target vier-gewinnt-gui match_session_tests --parallel 2
      - name: Validate packaged school logo (original or scaled licensed mirror)
        shell: bash
        run: python tests/verify_school_logo.py build-gui
      - name: Test headless GUI core without a desktop
        shell: bash
        run: ctest --test-dir build-gui -C Release --output-on-failure -R 'match_session_unit_tests|gui_core_smoke|gui_window_smoke'
      - name: Verify and package a portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDirectory build-gui
      - name: Upload tested Windows ZIP and SHA-256
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gym-edition-2d-windows-msvc
          path: |
            dist/Gym-Edition-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
