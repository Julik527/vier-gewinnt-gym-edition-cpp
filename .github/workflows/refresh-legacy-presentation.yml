name: Export historical presentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators and document converter
        run: |
          python -m pip install python-pptx PyMuPDF
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-liberation
          fi
      - name: Normalize PPTX and regenerate PDF
        run: python scripts/normalize_legacy_presentation.py
      - uses: actions/upload-artifact@v4
        with:
          name: historischer-projektvortrag
          path: |
            praesentation/Vier_Gewinnt_Praesentation_FINAL.pptx
            praesentation/Vier_Gewinnt_Praesentation_FINAL.pdf
