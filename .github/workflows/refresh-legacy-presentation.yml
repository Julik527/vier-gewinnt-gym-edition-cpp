name: Refresh historical presentation

on:
  push:
    branches: [docs/sachliche-projektdokumentation-2026-11-11]
    paths:
      - "scripts/normalize_legacy_presentation.py"
      - ".github/workflows/refresh-legacy-presentation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators and presentation converter
        run: |
          python -m pip install python-pptx PyMuPDF
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-liberation
          fi
      - name: Remove promotional text and regenerate PDF
        run: python scripts/normalize_legacy_presentation.py
      - name: Commit verified PPTX and PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add praesentation/Vier_Gewinnt_Praesentation_FINAL.pptx praesentation/Vier_Gewinnt_Praesentation_FINAL.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: remove slogans from archived seventeen-slide deck"
            git push origin HEAD:docs/sachliche-projektdokumentation-2026-11-11
          fi
