name: V6 Milestone Import Checks

on:
  pull_request:
    paths:
      - "milestones/**"
      - "README.md"
      - "docs/README.md"
      - "praesentation/README.md"
      - "docs/schule/ABGABEDATEIEN.md"
      - "scripts/verify_v6_import.py"
      - ".github/workflows/v6-import-check.yml"
  push:
    branches: [main]
    paths:
      - "milestones/**"
      - "README.md"
      - "docs/README.md"
      - "praesentation/README.md"
      - "docs/schule/ABGABEDATEIEN.md"
      - "scripts/verify_v6_import.py"
      - ".github/workflows/v6-import-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v6-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify V6 import manifest and document integrity
        run: python scripts/verify_v6_import.py
