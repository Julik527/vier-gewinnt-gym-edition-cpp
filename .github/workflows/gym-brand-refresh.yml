name: JK AXIS Gym Edition Branding

on:
  push:
    branches: [main]
    paths:
      - "scripts/rebrand_assets.py"
      - ".github/workflows/gym-brand-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install document dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-pptx Pillow PyMuPDF
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress
      - name: Replace legacy logos, synchronize presentation PDF, and audit
        run: python scripts/rebrand_assets.py
      - name: Verify files
        run: |
          python - <<'PY'
          import pathlib, fitz
          from pptx import Presentation
          p=Presentation("praesentation/Vier_Gewinnt_Praesentation_FINAL.pptx")
          assert len(p.slides)==17
          for slide in p.slides:
              for sh in slide.shapes:
                  if sh.has_text_frame:
                      assert "JK-CD-DE-2026-003" not in sh.text
          for filename in sorted(pathlib.Path("reference").glob("*.pdf")) + sorted(pathlib.Path("praesentation").glob("*.pdf")):
              d=fitz.open(filename)
              assert len(d)>0, filename
              d[0].get_pixmap(matrix=fitz.Matrix(0.3,0.3))
              d.close()
          print("Technical validation passed")
          PY
      - name: Commit changed project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- praesentation/ reference/ docs/BRAND_QA_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: upgrade project files to JK AXIS GOLD MASTER branding"
            git push origin HEAD:main
          else
            echo "No binary document changes detected."
          fi
